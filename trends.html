<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xu hướng thị trường — Career Sight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="trends">
  <a class="skip-link" href="#main">Bỏ qua tới nội dung</a>
  <div data-component="header"></div>
  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <span class="eyebrow">Xu hướng thị trường <span class="badge badge--soon">Bản xem trước</span></span>
          <h1 class="h2">Thị trường đang cần kỹ năng gì?</h1>
          <p class="muted">Kỹ năng “hot”, đang lên/đang giảm và bộ kỹ năng thường được tuyển chung. Bản chính thức chạy khi có đủ chuỗi thời gian dữ liệu.</p>
        </div>
        <div id="color-toggle"></div>
      </div>

      <div class="chip-scroll" id="ind-chips" role="group" aria-label="Chọn nhóm ngành" style="margin-bottom:1rem"></div>

      <div class="row row--between" style="margin-bottom:1.25rem">
        <div class="tabs" role="tablist" aria-label="Góc nhìn xu hướng">
          <button class="tab" type="button" role="tab" data-tab="hot" aria-selected="true">Top kỹ năng “hot”</button>
          <button class="tab" type="button" role="tab" data-tab="move" aria-selected="false">Đang lên / đang giảm</button>
          <button class="tab" type="button" role="tab" data-tab="cluster" aria-selected="false">Cụm kỹ năng đi kèm</button>
        </div>
        <button class="btn btn--outline btn--sm filter-toggle" type="button" data-sheet-open="#trend-filters"><span data-icon="filter" data-size="16"></span>Bộ lọc</button>
      </div>

      <div class="sheet card card--pad" id="trend-filters" aria-label="Bộ lọc" style="margin-bottom:1.25rem">
        <div class="sheet__head"><b>Bộ lọc</b><button class="icon-btn icon-btn--sm" type="button" data-sheet-close aria-label="Đóng"><span data-icon="close" data-size="16"></span></button></div>
        <div class="filter-bar">
          <label class="field"><span class="field__label xs">Khu vực</span><select class="select select--sm" id="f-loc"></select></label>
          <label class="field"><span class="field__label xs">Cấp độ</span><select class="select select--sm" id="f-level"></select></label>
          <label class="field"><span class="field__label xs">Khoảng thời gian</span>
            <select class="select select--sm" id="f-time"><option>3 tháng gần nhất</option><option>6 tháng gần nhất</option><option selected>12 tháng gần nhất</option></select></label>
          <button class="btn btn--primary btn--sm" type="button" data-sheet-close id="f-apply">Áp dụng</button>
        </div>
      </div>

      <div id="trend-root" aria-live="polite"></div>
    </div>
  </main>

  <dialog class="dialog" id="cluster-dialog" aria-labelledby="cl-title">
    <div class="dialog__head"><h2 class="h3" id="cl-title"></h2>
      <button class="icon-btn" type="button" data-close-dialog aria-label="Đóng"><span data-icon="close" data-size="18"></span></button></div>
    <div class="dialog__body"><ul class="list-plain" id="cl-list"></ul></div>
    <div class="dialog__foot">
      <button class="btn btn--ghost" type="button" data-close-dialog>Đóng</button>
      <button class="btn btn--primary" type="button" id="cl-add">Thêm cả cụm vào lộ trình</button>
    </div>
  </dialog>
  <div data-component="footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/trends.js"></script>
</body>
</html>
