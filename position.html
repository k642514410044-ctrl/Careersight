<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chọn vị trí — Career Sight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="position">
  <a class="skip-link" href="#main">Bỏ qua tới nội dung</a>
  <div data-component="header"></div>
  <main id="main" class="page">
    <div class="container">
      <div data-component="stepper" data-step="0"></div>
      <div class="page-head">
        <div>
          <span class="eyebrow">Bước 1 · Đánh giá tương thích</span>
          <h1 class="h2">Bạn muốn làm vị trí nào?</h1>
          <p class="muted">Chọn 1–3 vị trí để so sánh. Bấm vào thẻ để xem nhanh các kỹ năng phổ biến nhất của vị trí đó.</p>
        </div>
      </div>

      <div class="picker-tools">
        <div class="input-wrap input-wrap--icon">
          <label class="sr-only" for="pos-q">Tìm vị trí</label>
          <span class="input-wrap__icon" data-icon="search" data-size="18"></span>
          <input class="input" id="pos-q" type="search" placeholder="Tìm vị trí, VD: Analyst, Kế toán…" autocomplete="off">
        </div>
        <div class="chip-scroll" id="ind-chips" role="group" aria-label="Lọc theo nhóm ngành"></div>
      </div>

      <div id="pos-groups" aria-live="polite"></div>

      <div class="selection-bar" id="sel-bar">
        <div class="row" style="flex:1;min-width:240px">
          <span class="small" style="font-weight:700">Đã chọn <span id="sel-count">0</span>/3:</span>
          <div class="chip-row" id="sel-tags"></div>
        </div>
        <div class="row">
          <label><span class="sr-only">Cấp độ</span><select class="select select--sm" id="sel-level"></select></label>
          <label><span class="sr-only">Khu vực</span><select class="select select--sm" id="sel-loc"></select></label>
          <button class="btn btn--primary" type="button" id="continue">Tiếp tục <span data-icon="arrow" data-size="18"></span></button>
        </div>
      </div>
    </div>
  </main>

  <!-- Cửa sổ xem trước vị trí -->
  <dialog class="dialog" id="peek" aria-labelledby="peek-title">
    <div class="dialog__head">
      <div><h2 class="h3" id="peek-title"></h2><div class="pos-card__meta" id="peek-meta"></div></div>
      <button class="icon-btn" type="button" data-close-dialog aria-label="Đóng"><span data-icon="close" data-size="18"></span></button>
    </div>
    <div class="dialog__body">
      <p class="small muted" style="margin-bottom:.5rem">Kỹ năng phổ biến nhất (% tin yêu cầu)</p>
      <ul class="preview-list" id="peek-list"></ul>
      <div id="peek-transparency"></div>
    </div>
    <div class="dialog__foot">
      <button class="btn btn--ghost" type="button" data-close-dialog>Đóng</button>
      <button class="btn btn--primary" type="button" id="peek-select">Chọn vị trí này</button>
    </div>
  </dialog>
  <div data-component="footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/position.js"></script>
</body>
</html>
